services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      - SITE_URL=${SITE_URL:-http://localhost}
    volumes:
      - ./server/data.db:/app/data.db
    networks:
      - internal

  next:
    build:
      context: .
      dockerfile: Dockerfile.next
    restart: unless-stopped
    environment:
      - API_URL=http://api:3001
      - PORT=3000
    depends_on:
      - api
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - next
    networks:
      - internal

networks:
  internal:
    driver: bridge
